---
- name: Деплой асинхронного сервиса конфигурации оборудования
  hosts: app_servers
  become: yes

  tasks:
    - name: Обновление кэша пакетов и установка системных зависимостей
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - software-properties-common
          - python3-pip
        state: present
        update_cache: yes
      tags: [ 'infra', 'apt' ]

    - name: Установка модов доступа для APT
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
        owner: root
        group: root
      tags: [ 'infra', 'apt' ]

    - name: Загрузка GPG ключа Docker и сохранение его в директории keyrings
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: '0644'
      tags: [ 'infra', 'apt' ]

    - name: Определение кодового имени Ubuntu для корректного добавления репозитория Docker
      command: /bin/sh -c '. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}"'
      register: ubuntu_codename
      changed_when: false

    - name: Чекаем архитектуру системы для корректного добавления репозитория Docker
      command: dpkg --print-architecture
      register: dpkg_arch
      changed_when: false

    - name: Добавление официального репозитория Docker в список источников APT
      apt_repository:
        repo: "deb [arch={{ dpkg_arch.stdout }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ubuntu_codename.stdout }} stable"
        state: present
        filename: docker
      tags: [ 'infra', 'apt' ]

    - name: Обновление кэша APT
      apt:
        update_cache: yes
      tags: [ 'infra', 'apt' ]
          
    - name: Установка Docker Engine и Docker Compose
      become: yes
      apt:  
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: yes
      tags: [ 'infra', 'docker' ]

    - name: Установка библиотеки-коннектора docker для Python
      apt:
        name: python3-docker
        state: present
      tags: [ 'infra', 'apt' ]

    - name: Создание директории для проекта на удаленном сервере
      file:
        path: /opt/rostelecom_task
        state: directory
        mode: '0755'
      tags: [ 'deploy' ]

    - name: Копирование исходного кода проекта на server
      copy:
        src: "{{ playbook_dir }}/../"
        dest: /opt/rostelecom_task/
        mode: '0755'
      tags: [ 'deploy' ]

    - name: Сборка образов и запуск контейнеров через Docker Compose
      community.docker.docker_compose_v2:
        project_src: /opt/rostelecom_task
        state: present
        build: always
        recreate: always
      tags: [ 'deploy' ]