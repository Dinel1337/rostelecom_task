[project]
name = "consumer"
version = "0.1.0"
description = "Background worker for equipment provisioning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=9.4.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.24.0"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
