name: CI Service B

on:
  push:
    # branches: ["develop", "main"]
    paths:
      - "service_b/**"
      - ".github/workflows/ci-service-b.yml"
  pull_request:
    # branches: ["develop", "main"]
    paths:
      - "service_b/**"

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dinelefox
          POSTGRES_DB: tasks
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        run: uv python install 3.12

      - name: Install deps
        run: |
          cd service_b
          uv sync

      - name: Run tests
        env:
          DATABASE_URL: postgresql+psycopg2://postgres:dinelefox@localhost:5432/tasks
          RABBIT_URL: amqp://guest:guest@localhost:5672/
          DEBUG: "true"
        run: |
          cd service_b
          uv run pytest -q