name: CI Service A

on:
  push:
    branches: [ "ci-service-a", "develop", "main" ]
    paths:
      - 'service_a/**'
      - '.github/workflows/ci-service-a.yml'
  pull_request:
    branches: [ "develop", "main" ]
    paths:
      - 'service_a/**'
      - '.github/workflows/ci-service-a.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
      
      - name: Install Python
        run: uv python install 3.12
      
      - name: Install dependencies
        run: |
          cd service_a
          uv sync
      
      - name: Lint with ruff
        run: |
          cd service_a
          uv run ruff check . || true
      
      - name: Test with pytest
        run: |
          cd service_a
          uv run pytest tests/ -v --maxfail=3