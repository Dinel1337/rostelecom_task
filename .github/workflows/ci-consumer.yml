name: CI Consumer

on:
  push:
    branches: ["develop", "main"]
    paths:
      - "consumer/**"
      - ".github/workflows/ci-consumer.yml"
  pull_request:
    branches: ["develop", "main"]
    paths:
      - "consumer/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Setup Python
        run: uv python install 3.12

      - name: Install deps
        run: |
          cd consumer
          uv sync

      - name: Run tests
        run: |
          cd consumer
          uv run pytest -q